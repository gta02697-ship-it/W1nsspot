<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ИИ-Терминал // КОЛЫВАН</title>
<style>
    @font-face { font-family: "W1nssMinecraft"; src: url("http://192.168.4.2/Minecraftia-Regular.ttf") format("truetype"); }
    :root { --bg: #050302; --panel: #0a0705; --orange: #ff6a00; --amber: #ffd05b; --text: #fff5e5; --border: #552a0a; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    body { background: var(--bg); color: var(--text); font-family: "W1nssMinecraft", monospace; display:flex; flex-direction:column; position:relative; min-height:0; }
    .bg-terminal { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden; opacity:0.30; display:flex; flex-direction:column; padding:10px; }
    .terminal-line { font-family:'Courier New', monospace; font-size:11px; line-height:1.5; color:var(--orange); text-shadow:0 0 4px rgba(255,106,0,0.65); white-space:pre-wrap; margin:0; flex-shrink:0; }
    body::after { content:""; position:fixed; inset:0; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%); z-index:2; background-size:100% 2px; pointer-events:none; }
    .header { display:flex; align-items:center; gap:12px; padding:15px 20px; border-bottom:1px solid var(--border); background:rgba(10,7,5,0.9); position:relative; z-index:5; flex-shrink:0; }
    .header h1 { margin:0; font-size:15px; color:var(--amber); letter-spacing:3px; }
    .header svg { width:26px; height:26px; color:var(--orange); }
    .status-image { display:block; width:48px; height:48px; margin-left:auto; object-fit:contain; animation:breath 3s infinite alternate; }
    @keyframes breath { from { opacity:0.5; transform:scale(0.95); } to { opacity:1; transform:scale(1.05); } }
    .chat-container { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; z-index:4; }
    .msg { max-width:85%; padding:15px; border-radius:8px; font-size:11px; line-height:1.7; background:rgba(10,7,5,0.9); white-space:pre-wrap; animation:slide 0.3s ease; }
    @keyframes slide { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    .msg.user { align-self:flex-end; background:rgba(255,106,0,0.15); border:1px solid var(--orange); }
    .msg.ai { align-self:flex-start; border-left:3px solid var(--orange); }
    .msg.ai::before { content:"КОЛЫВАН >>"; display:block; font-size:8px; color:var(--orange); margin-bottom:6px; }
    .input-area { padding:15px 20px; background:rgba(10,7,5,0.98); border-top:1px solid var(--border); display:flex; gap:12px; z-index:10; flex-shrink:0; }
    .input-area input { flex:1; padding:14px; background:#000; border:1px solid var(--border); color:var(--amber); border-radius:6px; outline:none; font-family:inherit; }
    .input-area button { padding:0 16px; background:var(--orange); border:none; border-radius:6px; color:#170900; font-weight:800; cursor:pointer; font-family:inherit; text-transform:uppercase; }
</style>
</head>
<body>
<div class="bg-terminal" id="bgTerminal"></div>
<div class="header">
    <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" stroke="currentColor" stroke-width="1.8"/></svg>
    <div><h1>КОЛЫВАН // НЕЙРОСЕТЬ</h1></div>
    <img class="status-image" src="http://192.168.4.2/status.png" alt="Статус" onerror="this.style.display='none'">
</div>
<div class="chat-container" id="chatContainer"></div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="ВВЕДИ ЗАПРОС..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Откалыванить</button>
</div>
<script>
const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const SERVER_IP = "192.168.4.3:8088";

const bg = document.getElementById('bgTerminal');
const cmds = ['C:\\> systeminfo', 'C:\\> ping 192.168.4.2', '[KOLIVAN] Loading...', '[KOLIVAN] Ready'];
let ci = 0;
function typeBg() {
    const el = document.createElement('div');
    el.className = 'terminal-line';
    el.textContent = cmds[ci % cmds.length];
    bg.appendChild(el);
    if (bg.childElementCount > 20) bg.removeChild(bg.firstElementChild);
    ci++;
    setTimeout(typeBg, 2000);
}
typeBg();

function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    const aiMsgDiv = addMessage('Думаю...', 'ai');
    
    try {
        const response = await fetch(`http://${SERVER_IP}/ai?text=${encodeURIComponent(text)}`);
        if (!response.ok) throw new Error("Сервер не отвечает");
        
        const answer = await response.text();
        aiMsgDiv.textContent = answer;
    } catch (error) {
        aiMsgDiv.textContent = "[ОШИБКА]: " + error.message;
    } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }
}
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
