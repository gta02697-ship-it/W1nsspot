<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ИИ-Терминал // КОЛЫВАН</title>
<style>
    @font-face { font-family: "W1nssMinecraft"; src: url("http://192.168.4.2/Minecraftia-Regular.ttf") format("truetype"); }
    :root { --bg:#050302; --panel:#0a0705; --orange:#ff6a00; --amber:#ffd05b; --text:#fff5e5; --border:#552a0a; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font-family:"W1nssMinecraft", monospace; display:flex; flex-direction:column; }
    .header { display:flex; align-items:center; gap:12px; padding:15px 20px; border-bottom:1px solid var(--border); background:rgba(10,7,5,0.9); }
    .header h1 { margin:0; font-size:15px; color:var(--amber); }
    .chat-container { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:20px; }
    .msg { max-width:85%; padding:15px; border-radius:8px; font-size:11px; line-height:1.7; background:rgba(10,7,5,0.9); white-space: pre-wrap; }
    .msg.user { align-self:flex-end; background:rgba(255,106,0,0.15); border:1px solid var(--orange); }
    .msg.ai { align-self:flex-start; border-left:3px solid var(--orange); }
    .input-area { padding:15px 20px; background:rgba(10,7,5,0.98); border-top:1px solid var(--border); display:flex; gap:12px; }
    .input-area input { flex:1; padding:14px; background:#000; border:1px solid var(--border); color:var(--amber); border-radius:6px; outline:none; }
    .input-area button { padding:0 16px; background:var(--orange); border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<div class="header"><h1>КОЛЫВАН // НЕЙРОСЕТЬ</h1></div>
<div class="chat-container" id="chatContainer"></div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="ВВЕДИ ЗАПРОС..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Откалыванить</button>
</div>
<script>
const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const SERVER_IP = "192.168.4.3:8087";

function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    const aiMsgDiv = addMessage('', 'ai');
    
    try {
        const response = await fetch(`http://${SERVER_IP}/ai?text=${encodeURIComponent(text)}`);
        if (!response.ok) throw new Error("Сервер не отвечает");
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            aiMsgDiv.textContent += chunk;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    } catch (error) {
        aiMsgDiv.textContent = "[ОШИБКА]: " + error.message;
    } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }
}

userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
