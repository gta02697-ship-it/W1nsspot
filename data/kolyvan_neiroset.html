<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ИИ-Терминал // КОЛЫВАН</title>
<style>
    @font-face {
        font-family: "W1nssMinecraft";
        src: url("http://192.168.4.2/Minecraftia-Regular.ttf") format("truetype");
    }
    :root {
        --bg: #050302; --panel: #0a0705; --orange: #ff6a00; --amber: #ffd05b;
        --text: #fff5e5; --muted: #887766; --border: #552a0a;
        --green: #35ff9b; --red: #ff3939;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    body {
        background: var(--bg); color: var(--text);
        font-family: "W1nssMinecraft", monospace;
        display:flex; flex-direction:column; position:relative; min-height:0;
    }
    .bg-terminal {
        position:fixed; inset:0; width:100%; height:100%; z-index:0;
        pointer-events:none; overflow:hidden; opacity:0.30;
        display:flex; flex-direction:column; justify-content:flex-start;
        padding:10px; contain:layout paint;
    }
    .terminal-line {
        font-family:'Courier New', monospace; font-size:11px; line-height:1.5;
        color:var(--orange); text-shadow:0 0 4px rgba(255,106,0,0.65);
        white-space:pre-wrap; word-break:break-all; margin:0; padding:0; flex-shrink:0;
    }
    .cursor {
        display:inline-block; width:6px; height:12px; background:var(--orange);
        animation:blink 1s step-end infinite; vertical-align:middle; margin-left:2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    body::after {
        content:""; position:fixed; inset:0;
        background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
                    linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,255,0,0.06));
        z-index:2; background-size:100% 2px, 3px 100%; pointer-events:none;
    }
    .header {
        display:flex; align-items:center; gap:12px; padding:15px 20px;
        border-bottom:1px solid var(--border); background:rgba(10,7,5,0.9);
        position:relative; z-index:5; box-shadow:0 0 20px rgba(255,106,0,0.1); flex-shrink:0;
    }
    .header svg { width:26px; height:26px; color:var(--orange); filter:drop-shadow(0 0 5px var(--orange)); flex-shrink:0; }
    .header-title { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .header h1 { margin:0; font-size:15px; color:var(--amber); letter-spacing:3px; text-shadow:0 0 8px var(--orange); }
    .header-subtitle { color:#8f7864; font-family:'Courier New', monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; }
    .status-image {
        display:block; width:58px; height:58px; margin-left:auto; flex:0 0 58px;
        object-fit:contain; transform:scale(0.94); transform-origin:center;
        will-change:opacity, transform, filter;
        animation:statusBreath 3.6s cubic-bezier(0.37,0,0.63,1) infinite alternate;
    }
    @keyframes statusBreath {
        from { opacity:0.28; transform:scale(0.94); filter:brightness(0.82); }
        to { opacity:1; transform:scale(1.04); filter:brightness(1.18); }
    }
    .chat-container {
        flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; padding:20px;
        display:flex; flex-direction:column; gap:20px; position:relative; z-index:4; scroll-behavior:auto;
    }
    .chat-container::-webkit-scrollbar { width:6px; }
    .chat-container::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .chat-container::-webkit-scrollbar-track { background:transparent; }
    .msg {
        max-width:85%; padding:15px; border-radius:8px; font-size:11px; line-height:1.7;
        position:relative; animation:slideIn 0.3s ease; background:rgba(10,7,5,0.9);
        overflow-wrap:anywhere;
    }
    @keyframes slideIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    .msg.user {
        align-self:flex-end; background:rgba(255,106,0,0.15); border:1px solid var(--orange);
        color:var(--text); box-shadow:0 0 10px rgba(255,106,0,0.2);
    }
    .msg.ai {
        align-self:flex-start; border-left:3px solid var(--orange); border-top:1px solid #222;
        border-bottom:1px solid #222; border-right:1px solid #222; color:var(--text);
        box-shadow:0 0 15px rgba(0,0,0,0.5);
    }
    .msg.ai::before {
        content:"КОЛЫВАН >>"; display:block; font-size:8px; color:var(--orange);
        margin-bottom:6px; opacity:0.8; letter-spacing:1px;
    }
    .msg.ai.thinking-message {
        width:fit-content; max-width:92%; padding:8px 12px;
        border:1px solid rgba(255,106,0,0.45); border-left:3px solid var(--orange);
        background:rgba(20,10,3,0.96); box-shadow:0 0 8px rgba(255,106,0,0.14);
    }
    .msg.ai.thinking-message::before { display:none; }
    .thinking { display:block; color:#ffd98a; font-style:normal; font-size:10px; line-height:1.5; }
    .thinking-text { animation:thinkingGlow 1.5s ease-in-out infinite; }
    @keyframes thinkingGlow {
        0%,100% { color:#ffb347; text-shadow:0 0 4px rgba(255,106,0,0.7); }
        50% { color:#fff2c9; text-shadow:0 0 9px rgba(255,106,0,0.8); }
    }
    .input-area {
        padding:15px 20px; background:rgba(10,7,5,0.98); border-top:1px solid var(--border);
        display:flex; flex-direction:row; gap:12px; position:relative; z-index:10;
        flex:0 0 auto; width:100%; min-height:72px; align-items:stretch;
    }
    .input-area input {
        display:block; flex:1 1 auto; min-width:0; width:100%; padding:14px;
        background:#000; border:1px solid var(--border); border-radius:6px;
        color:var(--amber); font-size:12px; outline:none; font-family:inherit;
        box-shadow:inset 0 0 10px rgba(0,0,0,0.8);
    }
    .input-area input:focus { border-color:var(--orange); box-shadow:0 0 10px rgba(255,106,0,0.3); }
    .input-area button {
        display:flex; align-items:center; justify-content:center; flex:0 0 auto; padding:0 16px;
        background:linear-gradient(180deg, #ffad42 0%, var(--orange) 100%);
        border:1px solid rgba(255,210,145,0.55); border-radius:6px; color:#170900;
        font-size:10px; font-weight:800; cursor:pointer; transition:transform 0.18s ease, box-shadow 0.22s ease, filter 0.22s ease;
        font-family:inherit; text-transform:uppercase; letter-spacing:0.7px;
        box-shadow:0 3px 7px rgba(0,0,0,0.48), 0 0 12px rgba(255,106,0,0.28), inset 0 1px 0 rgba(255,255,255,0.28);
        text-shadow:0 1px 0 rgba(255,255,255,0.16);
    }
    .input-area button:hover:not(:disabled) {
        transform:translateY(-1px); filter:brightness(1.08);
        box-shadow:0 5px 11px rgba(0,0,0,0.52), 0 0 16px rgba(255,106,0,0.42), inset 0 1px 0 rgba(255,255,255,0.34);
    }
    .input-area button:active { transform:translateY(1px) scale(0.98); }
    .input-area button:disabled { opacity:0.5; cursor:not-allowed; background:#333; color:#888; box-shadow:none; }
    .scroll-btn {
        position:fixed; bottom:100px; right:20px; width:45px; height:45px;
        background:var(--orange); border:2px solid var(--amber); border-radius:50%;
        display:none; align-items:center; justify-content:center; color:black; cursor:pointer;
        z-index:100; box-shadow:0 0 20px rgba(255,106,0,0.8); animation:fadeIn 0.3s;
    }
    .scroll-btn svg { width:22px; height:22px; }
    .corner { position:absolute; width:20px; height:20px; border-color:var(--orange); border-style:solid; opacity:0.5; z-index:6; pointer-events:none; }
    .tl { top:80px; left:10px; border-width:2px 0 0 2px; }
    .br { bottom:80px; right:10px; border-width:0 2px 2px 0; }
    @media (max-width:600px) {
        .header { padding:13px 14px; }
        .header h1 { font-size:12px; letter-spacing:2px; }
        .header-subtitle { font-size:8px; letter-spacing:1px; }
        .status-image { width:48px; height:48px; flex-basis:48px; }
        .chat-container { padding:14px; }
        .input-area { padding:10px; gap:8px; min-height:64px; }
        .input-area input { padding:12px 10px; font-size:11px; }
        .input-area button { padding:0 11px; font-size:9px; letter-spacing:0.35px; }
        .msg { max-width:92%; }
        .msg.ai.thinking-message { padding:7px 10px; }
        .thinking { font-size:9px; }
    }
</style>
</head>
<body>
<div class="bg-terminal" id="bgTerminal"></div>
<div class="corner tl"></div>
<div class="corner br"></div>
<div class="header">
    <svg viewBox="0 0 24 24" fill="none">
        <rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" stroke="currentColor" stroke-width="1.8"/>
    </svg>
    <div class="header-title">
        <h1>КОЛЫВАН // НЕЙРОСЕТЬ</h1>
        <div class="header-subtitle">LOCAL AI INTERFACE · 2.6</div>
    </div>
    <img class="status-image" src="status.png" alt="Статус системы">
</div>
<div class="chat-container" id="chatContainer"></div>
<div class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()">
    <svg viewBox="0 0 24 24" fill="none"><path d="m5 9 7 7 7-7" stroke="currentColor" stroke-width="3"/></svg>
</div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="ВВЕДИ ЗАПРОС..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Откалыванить</button>
</div>
<script>
const bgTerminal = document.getElementById('bgTerminal');
const commands = ['C:\\> systeminfo','C:\\> ipconfig /all','C:\\> tasklist','C:\\> netstat -ano','C:\\> whoami','C:\\> tree C:\\AI_CORE','C:\\> dir /s /b *.dll','C:\\> chkdsk C:','C:\\> sfc /verifyonly','C:\\> ver','C:\\> hostname','C:\\> getmac','C:\\> driverquery','C:\\> ping 192.168.4.2','C:\\> tracert 192.168.4.1','C:\\> echo KOLIVAN CORE ONLINE','C:\\> cls','C:\\AI_CORE> status --verbose','C:\\AI_CORE> model_info','C:\\AI_CORE> tokenizer --stats','C:\\AI_CORE> memory_check','C:\\AI_CORE> neural_net --status','C:\\AI_CORE> load_modules','C:\\AI_CORE> scan_storage','C:\\AI_CORE> diagnostics --full','C:\\AI_CORE> sync --local'];
const outputPools = [[ 'Host Name: KOLIVAN','OS Name: Microsoft Windows 10 Pro','OS Version: 10.0.19045 Build 19045','System Type: x64-based PC','System Manufacturer: W1NSSPOT','System Model: Local Node','System Status: ONLINE' ],['Windows IP Configuration','Wireless LAN adapter Wi-Fi:','   Connection-specific DNS Suffix  . : local','   IPv4 Address. . . . . . . . . . . : 192.168.4.2','   Subnet Mask . . . . . . . . . . . : 255.255.255.0','   Default Gateway . . . . . . . . . : 192.168.4.1','   DHCP Enabled. . . . . . . . . . . : YES' ],['C:\\Windows\\system32\\advapi32.dll','C:\\Windows\\system32\\bcryptprimitives.dll','C:\\Windows\\system32\\combase.dll','C:\\Windows\\system32\\cryptbase.dll','C:\\Windows\\system32\\kernel32.dll','C:\\Windows\\system32\\kernelbase.dll','C:\\Windows\\system32\\ntdll.dll','C:\\Windows\\system32\\user32.dll','C:\\Windows\\system32\\ws2_32.dll' ],['[OK] Core services initialized','[OK] Local database connected','[OK] Interface controller ready','[OK] Memory manager active','[OK] Text engine loaded','[OK] Input stream available','[OK] Output stream available','[OK] Terminal session established' ],['[KOLIVAN] Initializing neural interface...','[KOLIVAN] Loading language modules...','[KOLIVAN] Checking response engine...','[KOLIVAN] Context buffer synchronized','[KOLIVAN] Local inference: READY','[KOLIVAN] Dialogue module: ACTIVE','[KOLIVAN] Waiting for user input...' ],['Memory Status: NORMAL','Cache Status: VALID','Storage Status: READY','CPU Scheduler: ACTIVE','Process Queue: STABLE','System Integrity: VERIFIED','Runtime Environment: LOCAL' ],['14:02:11  [INFO] Service started','14:02:12  [INFO] Configuration loaded','14:02:13  [INFO] Session initialized','14:02:14  [OK] Connection established','14:02:15  [INFO] Background task complete','14:02:16  [OK] No errors detected' ],['C:\\AI_CORE\\model_config.txt','C:\\AI_CORE\\tokenizer.dat','C:\\AI_CORE\\language_pack.bin','C:\\AI_CORE\\memory_cache.tmp','C:\\AI_CORE\\system_prompt.cfg','C:\\AI_CORE\\runtime.dll','C:\\AI_CORE\\logs\\session.log' ],['PING 192.168.4.2: bytes=32 time=1ms TTL=128','PING 192.168.4.2: bytes=32 time=2ms TTL=128','PING 192.168.4.2: bytes=32 time=1ms TTL=128','Ping statistics: Sent = 3, Received = 3, Lost = 0','Approximate round trip times: Minimum = 1ms' ],['Process: KOLIVAN.EXE          RUNNING','Process: CORE_SERVICE.EXE     RUNNING','Process: TEXT_ENGINE.EXE      RUNNING','Process: MEMORY_CACHE.EXE     RUNNING','Process: UI_RENDERER.EXE      RUNNING','Process: INPUT_HANDLER.EXE    RUNNING' ],['Build version: 2.6.04','Runtime version: 10.0','Architecture: x64','Language: ru-RU','Encoding: UTF-8','Display mode: TERMINAL','Theme: AMBER_ORANGE' ],['Scanning local components...','Checking configuration files...','Verifying module signatures...','Checking available memory...','Refreshing local cache...','Updating session status...','All checks completed successfully.' ]];
const random = (min, max) => Math.random() * (max - min) + min;
function shuffle(array) { const result = array.slice(); for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; } return result; }
function buildScenario() { const result = []; const shuffledCommands = shuffle(commands); shuffledCommands.forEach((command, index) => { result.push({ type: 'input', text: command }); const pool = outputPools[Math.floor(Math.random() * outputPools.length)]; const lines = shuffle(pool).slice(0, Math.floor(random(3, 7))); lines.forEach(line => { result.push({ type: 'output', text: line }); }); if (index % 3 === 2) { result.push({ type: 'output', text: '------------------------------------------------------------' }); } }); return result; }
let scenario = buildScenario();
let currentLine = 0;
const MAX_BACKGROUND_LINES = 42;
function createCursor() { const cursor = document.createElement('span'); cursor.className = 'cursor'; return cursor; }
function addBackgroundLine() { const lineEl = document.createElement('div'); lineEl.className = 'terminal-line'; bgTerminal.appendChild(lineEl); while (bgTerminal.childElementCount > MAX_BACKGROUND_LINES) { bgTerminal.removeChild(bgTerminal.firstElementChild); } bgTerminal.scrollTop = bgTerminal.scrollHeight; return lineEl; }
function typeLine() { if (currentLine >= scenario.length) { scenario = buildScenario(); currentLine = 0; setTimeout(typeLine, 1200); return; } const lineData = scenario[currentLine]; const lineEl = addBackgroundLine(); if (lineData.type === 'input') { let charIndex = 0; const text = lineData.text; function typeChar() { if (charIndex < text.length) { charIndex = Math.min(charIndex + 3, text.length); lineEl.textContent = text.substring(0, charIndex); lineEl.appendChild(createCursor()); setTimeout(typeChar, 45); } else { lineEl.textContent = text; currentLine++; setTimeout(typeLine, random(300, 500)); } } typeChar(); } else { lineEl.textContent = lineData.text; currentLine++; setTimeout(typeLine, random(65, 130)); } }
typeLine();
const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const scrollBtn = document.getElementById('scrollBtn');
const DEMO_MODE = false;
const SERVER_IP = "192.168.4.3";
const DEMO_TEXT = "Я — искусственный интеллект нового поколения. Меня зовут Колыван. Я умею решать математику, писать сочинения, объяснять физику и даже поддерживать беседу. Мой создатель — w1nsspot. Я работаю полностью автономно и не требую подключения к глобальной сети. Чем я могу помочь тебе сегодня?";
function addMessage(text, type, id = null) { const div = document.createElement('div'); div.className = `msg ${type}`; if (id) div.id = id; div.innerHTML = text; chatContainer.appendChild(div); checkScroll(); return div; }
addMessage('AI для решения ваших задач!', 'ai');
function checkScroll() { const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 50; scrollBtn.style.display = isAtBottom ? 'none' : 'flex'; }
chatContainer.addEventListener('scroll', checkScroll);
function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; scrollBtn.style.display = 'none'; }
async function sendMessage() { const text = userInput.value.trim(); if (!text) return; addMessage(text, 'user'); userInput.value = ''; userInput.disabled = true; sendBtn.disabled = true; scrollToBottom(); const thinkingDiv = addMessage('<div class="thinking"><span class="thinking-text">Жир обрабатывает ваш запрос...</span></div>', 'ai'); thinkingDiv.classList.add('thinking-message'); scrollToBottom(); if (DEMO_MODE) { setTimeout(() => { thinkingDiv.remove(); const aiMsgDiv = addMessage('', 'ai'); let i = 0; const typingInterval = setInterval(() => { i = Math.min(i + 4, DEMO_TEXT.length); aiMsgDiv.textContent = DEMO_TEXT.slice(0, i); const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 100; if (isAtBottom) scrollToBottom(); if (i >= DEMO_TEXT.length) { clearInterval(typingInterval); userInput.disabled = false; sendBtn.disabled = false; userInput.focus(); } }, 45); }, 4000); return; } try { const response = await fetch(`http://${SERVER_IP}:8081/ai?text=${encodeURIComponent(text)}`); if (!response.ok) { throw new Error("Сервер не отвечает"); } thinkingDiv.remove(); const aiMsgDiv = addMessage('', 'ai'); const reader = response.body.getReader(); const decoder = new TextDecoder(); let fullText = ''; while (true) { const { done, value } = await reader.read(); if (done) break; fullText += decoder.decode(value, { stream: true }); aiMsgDiv.textContent = fullText; const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 100; if (isAtBottom) scrollToBottom(); } } catch (error) { thinkingDiv.remove(); addMessage(`[ОШИБКА СИСТЕМЫ]: ${error.message}`, 'ai'); } finally { userInput.disabled = false; sendBtn.disabled = false; userInput.focus(); } }
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { sendMessage(); } });
</script>
</body>
</html>
