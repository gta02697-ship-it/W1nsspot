<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>КОЛЫВАНФНАФ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    top: 0; left: 0; background: #000;
    touch-action: none; overscroll-behavior: none; user-select: none;
  }
  img {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: contain; /* Картинка вписывается целиком */
    display: block; pointer-events: none;
  }
</style>
</head>
<body>
  <img src="q.png" alt="Колыван">
</body>
</html>
