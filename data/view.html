<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ФОН ИГРЫ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed;
    top: 0; left: 0; background: #000;
    touch-action: none; overscroll-behavior: none; user-select: none;
  }
  img {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: contain; 
    display: block; pointer-events: none;
  }
  .back-btn {
    position: absolute; top: 20px; left: 20px; z-index: 10;
    background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #ff0000;
    padding: 10px 15px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 5px;
    text-decoration: none;
  }
</style>

<style>
  /* Пытаемся скрыть верхнюю панель, если она встроена как div или iframe */
  body > div:not(#fs-btn):not(.back-btn) { display: none !important; }
  body > iframe { display: none !important; }
</style>
<script>
  function toggleFullscreen() {
    // Запрос на полный экран (убирает адресную строку и шапку браузера)
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log("Ошибка полного экрана:", err);
        alert("Браузер не разрешил полный экран. Попробуй закрыть вкладки.");
      });
      document.getElementById('fs-btn').innerText = "[ ВЫЙТИ ИЗ ПОЛНОГО ЭКРАНА ]";
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
        document.getElementById('fs-btn').innerText = "[ СКРЫТЬ ПАНЕЛЬ ]";
      }
    }
  }
</script>


<style>
  /* Черная плашка, чтобы скрыть верхнюю панель браузера */
  #blackout-top {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 60px; /* Высота панели */
    background: #000;
    z-index: 9999;
    pointer-events: none; /* Чтобы можно было нажимать сквозь нее, если нужно */
  }
</style>
</head>

<body>
  <div id='blackout-top'></div>
  <a href="index.html" class="back-btn">← НАЗАД</a>
  
  <button id="fs-btn" onclick="toggleFullscreen()" style="position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #ff0000; padding: 8px 12px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 12px;">[ СКРЫТЬ ПАНЕЛЬ ]</button>

  <img src="q.png" alt="q.png">
</body>
</html>
