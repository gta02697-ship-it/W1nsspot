<style>

пульсацию */}.brand-hot{color:#ff6a00;text-shadow:0 0 6px #ff8a00,0 0 17px #ff6500,0 0 32px #ff4d0080}.brand-drop{color:#a94408;text-shadow:0 0 10px #b9430633}.system{white-space:nowrap;color:var(--amber);font-size:clamp(10px,3vw,14px);letter-spacing:.5px}.system b{color:var(--orange)}.heading{text-align:center;padding:clamp(7px,1.6vh,15px) 0 4px}.heading h1{margin:0;font-size:clamp(30px,8.5vw,47px);font-weight:1000;letter-spacing:1.8px;background:linear-gradient(#fff2b8,#ffd05b 48%,#ff8a16);color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 15px #ff850033)}.heading p{margin:4px 0 0;color:var(--muted);font-size:clamp(13px,3.8vw,18px);line-height:1.25}.eyebrow{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:7px;color:#a96a39;font-size:9px;font-weight:900;letter-spacing:3px}.eyebrow:before,.eyebrow:after{content:"";width:23px;height:1px;background:#a34b16}.stage{min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.wheel-wrap{width:min(64vw,min(34vh,310px));aspect-ratio:1;position:relative;flex-shrink:0;filter:drop-shadow(0 15px 24px #0009)}.wheel-shell{position:absolute;inset:0;border-radius:50%;border:2px solid #a94e17;background:radial-gradient(circle,#1b120b 58%,#080604);box-shadow:0 0 0 7px #ff790008,0 0 0 12px #ff790005,0 0 28px #ff790033,0 0 65px #ff790018,inset 0 0 35px #000}.wheel-shell:before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #ffbd4a30}.wheel-shell:after{content:"";position:absolute;inset:20px;border-radius:50%;border:1px dashed #ffb54a24}.progress-ring{position:absolute;inset:13px;border-radius:50%;background:conic-gradient(from 0deg,#ff5b00 0deg,#ffad16 var(--angle),#21170f var(--angle),#21170f 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));filter:drop-shadow(0 0 7px #ff790099);transition:none}.wheel-core{position:absolute;inset:29px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#302116,#171009 55%,#090604);border:1px solid #65401f;box-shadow:inset 0 0 38px #000,inset 0 0 12px #ff790015}.wheel-core:after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid #ffffff09}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;pointer-events:none}.percent{font-size:clamp(43px,11vw,64px);font-weight:1000;color:var(--green);text-shadow:0 0 13px #a5ed3766,0 0 30px #a5ed3725;font-variant-numeric:tabular-nums}.caption{margin-top:7px;color:#d0b89d;font-size:clamp(11px,3.4vw,16px);letter-spacing:2px}.pointer-orbit{position:absolute;inset:0;border-radius:50%;z-index:5;pointer-events:none;transform:rotate(0deg);will-change:transform}.pointer{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:27px solid #ffe08a;filter:drop-shadow(0 0 5px #ff9d00) drop-shadow(0 0 14px #ff7900)}.wheel-wrap.spinning .wheel-shell{animation:none; /* Убрали пульсацию при вращении */}.selected{text-align:center;padding:3px 0 10px;min-width:0}.skin-title{font-size:clamp(18px,5vw,27px);font-weight:1000;color:#ffd36c;text-shadow:0 0 15px #ff9d0033;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-label{display:none}.rarity-pill{display:inline-flex;align-items:center;justify-content:center;border:1px solid #a94e0b;border-radius:30px;padding:7px 17px;background:linear-gradient(120deg,#ff79001c,#ff790006);color:#ff922e;font-size:12px;font-weight:900;box-shadow:inset 0 0 14px #ff79000c,0 0 14px #ff790011}.upgrade{height:clamp(57px,9vh,76px);width:100%;flex-shrink:0;border:1px solid #ffe08a;border-radius:20px;background:linear-gradient(110deg,#ff5b00,#ff8700 48%,#ffc247);color:#1a0b01;font-size:clamp(20px,5.8vw,29px);font-weight:1000;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 0 13px #ff7900bb,0 0 32px #ff790066,0 0 65px #ff790022,inset 0 2px 4px #fff9,inset 0 -6px 14px #a33c0055;transition:transform .2s,filter .2s}.upgrade:before{content:"";position:absolute;top:-80%;left:-40%;width:35%;height:260%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff66,transparent);animation:none; /* Убрали блик */}.upgrade:after{content:"";position:absolute;inset:4px;border:1px solid #fff4;border-radius:15px;pointer-events:none}.upgrade:active{transform:scale(.98);filter:brightness(1.16)}.upgrade:disabled{opacity:.5;cursor:default}.result{min-height:35px;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd36c;font-size:clamp(11px,3.4vw,15px);font-weight:900;text-shadow:0 0 10px #ff9d0033;border-bottom:1px solid #71370799;padding:4px 0}.collection-head{height:34px;display:flex;align-items:center;color:#c4a78a;font-size:13px;letter-spacing:4px;flex-shrink:0}.inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:105px;overflow-y:auto;scrollbar-width:none;padding-bottom:5px}.inventory::-webkit-scrollbar{display:none}.card{min-width:0;min-height:76px;border:1px solid #633817;border-radius:15px;background:linear-gradient(145deg,#241508,#0c0805);padding:8px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff0c,transparent 48%);pointer-events:none}.card:active{transform:scale(.97)}.card.selected{border-color:var(--skin-color);box-shadow:0 0 16px #ff790033,inset 0 0 18px #ff790011}.card.selected:after{content:"✓";position:absolute;right:9px;top:6px;color:var(--skin-color);font-weight:1000}.skin-icon{width:39px;height:39px;flex-shrink:0;display:grid;place-items:center;font-size:24px;border-radius:13px;background:radial-gradient(circle,var(--skin-color)38,transparent 72%);filter:drop-shadow(0 0 8px var(--skin-color))}.card-name{font-size:11px;font-weight:900;line-height:1.2;padding-right:10px}.card-rarity{font-size:10px;color:var(--muted);margin-top:4px}.card-count{font-size:10px;color:#ff9d37;margin-top:3px}.empty{grid-column:1/-1;text-align:center;padding:12px;color:var(--muted);border:1px dashed #573016;border-radius:14px}.spark{position:fixed;z-index:20;pointer-events:none;width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--orange);animation:burst 1s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@media(max-height:700px){.app{grid-template-rows:48px auto minmax(130px,1fr) auto auto auto auto}.heading{padding:7px 0 3px}.heading h1{font-size:31px}.heading p{font-size:13px}.eyebrow{display:none}.wheel-wrap{width:min(55vw,min(31vh,245px))}.selected{padding-bottom:6px}.next-label{margin:5px 0 6px}.rarity-pill{padding:6px 13px}.upgrade{height:57px}.result{min-height:29px}.collection-head{height:27px}.inventory{max-height:82px}.card{min-height:64px}}@media(max-height:590px){.app{grid-template-rows:40px auto minmax(100px,1fr) auto auto auto auto}.brand{font-size:20px}.brand-mark{font-size:23px}.heading h1{font-size:25px}.heading p{font-size:11px}.wheel-wrap{width:min(44vw,min(26vh,185px))}.skin-title{font-size:17px}.next-label{font-size:12px}.upgrade{height:46px;font-size:19px}.result{min-height:25px}.collection-head{height:22px;font-size:11px}.inventory{max-height:65px}.card{min-height:53px}.skin-icon{width:31px;height:31px;font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="app"><header><div class="brand"><span class="brand-mark">✦</span><span class="brand-hot">ЖИРО</span><span class="brand-drop">ДРОП</span></div><div class="system"><b>◆</b> DROP SYSTEM</div></header><section class="heading"><h1>АПГРЕЙД</h1><p>Прокачай свой пузырь до новой редкости</p><div class="eyebrow">ULTIMATE UPGRADE SYSTEM</div></section><section class="stage"><div class="wheel-wrap" id="wheelWrap"><div class="wheel-shell"><div class="progress-ring" id="ring"></div><div class="wheel-core"></div></div><div class="pointer-orbit" id="orbit"><div class="pointer"></div></div><div class="center"><div class="percent" id="percent">50%</div><div class="caption">ШАНС УСПЕХА</div></div></div></section><section class="selected"><div class="skin-title" id="skinName"></div><div class="next-label" id="nextName" style="display:none"></div><div class="rarity-pill" id="rarity"></div></section><button class="upgrade" id="upgrade">ОБКАЛЫВАНИТЬ</button><div class="result" id="result">✦ ВЫБЕРИ СКИН ДЛЯ АПГРЕЙДА</div><div class="collection-head">ТВОЯ КОЛЛЕКЦИЯ</div><div class="inventory" id="inventory"></div></div>
<script>
const skins=[{name:"Оранжевый пузырь",rarity:"Обычный",chance:50,emoji:"🟠",color:"#ff7900"},{name:"Янтарный пузырь",rarity:"Редкий",chance:35,emoji:"🟡",color:"#ffd05b"},{name:"Огненный пузырь",rarity:"Легендарный",chance:12,emoji:"🔥",color:"#ff6a00"},{name:"Неоновый пузырь",rarity:"Мифический",chance:5,emoji:"💜",color:"#bd80ff"},{name:"Космический пузырь",rarity:"Божественный",chance:2,emoji:"🌌",color:"#70dfff"},{name:"Пузырь Колывана",rarity:"БОЖЕСТВЕННЫЙ",chance:0.5,emoji:"👑",color:"#ffd05b"}];const KEY="zhiroDropInventoryV4";const $=id=>document.getElementById(id);let inv=read(),selected=0,busy=false,rotation=0;function read(){try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length===skins.length)return x.map((v,i)=>Math.max(i===0?1:0,Number(v)||0))}catch(e){}return[1,0,0,0,0]}function next(i){return skins[i+1]||null}function render(){let s=skins[selected],n=next(selected),p=n?n.chance:0;$('ring').style.setProperty('--angle',p*3.6+'deg');$('percent').textContent=p+'%';$('skinName').textContent=s.name.toUpperCase();$('nextName').textContent='';$('rarity').textContent='РЕДКОСТЬ: '+s.rarity.toUpperCase();$('upgrade').disabled=busy||!n||inv[selected]<1;$('upgrade').textContent=n?'ОБКАЛЫВАНИТЬ':'МАКСИМАЛЬНЫЙ УРОВЕНЬ';let box=$('inventory');box.innerHTML='';skins.forEach((skin,i)=>{if(!inv[i])return;let c=document.createElement('div');c.className='card'+(i===selected?' selected':'');c.style.setProperty('--skin-color',skin.color);let ic=document.createElement('div');ic.className='skin-icon';ic.textContent=skin.emoji;let info=document.createElement('div');info.innerHTML='<div class="card-name"></div><div class="card-rarity"></div><div class="card-count"></div>';info.children[0].textContent=skin.name;info.children[1].textContent=skin.rarity;info.children[2].textContent='В наличии: '+inv[i];c.append(ic,info);c.onclick=()=>{if(!busy){selected=i;$('result').textContent='✦ ВЫБРАН: '+skin.name.toUpperCase();render()}};box.append(c)});if(!box.children.length)box.innerHTML='<div class="empty">Пока нет доступных скинов</div>'}function burst(){let r=$('wheelWrap').getBoundingClientRect();for(let i=0;i<42;i++){let p=document.createElement('i');p.className='spark';p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';let a=Math.random()*Math.PI*2,d=45+Math.random()*175;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');document.body.append(p);setTimeout(()=>p.remove(),1050)}}function landingAngle(chance,win){let z=chance*3.6;return win?Math.random()*Math.max(1,z-4)+2:z+4+Math.random()*Math.max(1,356-z)}$('upgrade').onclick=async()=>{if(busy||inv[selected]<1||!next(selected))return;busy=true;$('upgrade').disabled=true;let from=selected,n=next(from),win=Math.random()*100<n.chance,land=landingAngle(n.chance,win),start=rotation,end=start+360*8+((land-start%360+360)%360);$('result').textContent='✦ СТРЕЛКА ИЩЕТ СЕКТОР...';$('wheelWrap').classList.add('spinning');let a=$('orbit').animate([{transform:'rotate('+start+'deg)'},{transform:'rotate('+end+'deg)'}],{duration:6200,easing:'cubic-bezier(.08,.72,.12,1)',fill:'forwards'});await a.finished;rotation=end;$('orbit').style.transform='rotate('+end+'deg)';a.cancel();$('wheelWrap').classList.remove('spinning');if(win){inv[from]--;inv[from+1]++;selected=from+1;$('result').textContent='✦ УСПЕХ! ПОЛУЧЕН '+n.name.toUpperCase()+'!';burst()}else{if(from!==0)inv[from]--;$('result').textContent=from===0?'✦ НЕУДАЧА! СТАРТОВЫЙ СКИН СОХРАНЁН.':'✦ НЕУДАЧА! '+skins[from].name.toUpperCase()+' СГОРЕЛ!';if(inv[from]===0){selected=inv.findIndex((v,i)=>v>0&&i<skins.length-1);if(selected<0)selected=0}}inv[0]=Math.max(1,inv[0]);localStorage.setItem(KEY,JSON.stringify(inv));busy=false;render()};render();
</script></body></html>
