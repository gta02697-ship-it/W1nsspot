[platformio]
default_envs = m5stick

[env:m5stick]
platform = espressif32@6.13.0
framework = arduino
board = esp32dev
build_src_filter = +<main.cpp>

[env:devkit]
platform = espressif32@6.13.0
framework = arduino
board = esp32dev
build_src_filter = +<devkit.cpp>
board_build.filesystem = littlefs
board_build.partitions = default.csv
board_build.data_dir = site_build
