name: Build W1nsspot Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build M5Stick (Router)
      run: pio run -e m5stick

    - name: Build DevKit (Server)
      run: pio run -e devkit

    - name: Build DevKit Filesystem
      run: pio run -e devkit -t buildfs

    - name: Prepare Artifacts
      run: |
        mkdir -p artifacts
        cp .pio/build/m5stick/firmware.bin artifacts/m5stick_fw.bin
        cp .pio/build/devkit/firmware.bin artifacts/devkit_fw.bin
        cp .pio/build/devkit/littlefs.bin artifacts/devkit_fs.bin

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: w1nsspot-binaries
        path: artifacts/
